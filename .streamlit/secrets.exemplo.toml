# MODELO do .streamlit/secrets.toml — copie para "secrets.toml" e preencha.
# O secrets.toml NUNCA vai para o Git (está no .gitignore). Publicado na
# Streamlit Cloud, o conteúdo é colado em Settings -> Secrets.
#
# Com a seção [usuarios] preenchida, o painel SAI do modo demonstração: some o
# acesso rápido da tela de login e passam a valer só estes logins.
#
# A senha vai em hash. Para gerar:
#   python -c "from src.auth import gerar_hash; print(gerar_hash('a-senha'))"

[usuarios.proprietario]
login = "proprietario"
nome = "Nome do Proprietário"
perfil = "proprietario"          # proprietario | administrador | gerente
senha = "pbkdf2_sha256$260000$COLE-AQUI-O-HASH"

[usuarios.ana_candoi]
login = "ana.candoi"
nome = "Ana"
perfil = "gerente"
posto = "B2 Candói"              # o gerente vê e alimenta SÓ este posto
senha = "pbkdf2_sha256$260000$COLE-AQUI-O-HASH"

# Publicado: as planilhas enviadas pelo painel vão para o repositório privado,
# e o GitHub Actions monta a base. Token "fine-grained", só deste repositório,
# com a permissão "Contents: Read and write".
# [github]
# token = "github_pat_..."
# repo = "usuario/b2-gestao"
# branch = "main"
